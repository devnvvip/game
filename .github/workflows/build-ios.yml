name: Build iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA (Unity 6 Personal)
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Unity 6 and iOS Module
        uses: buildalon/unity-setup@v2
        id: unity_setup
        with:
          version-file: 'ProjectSettings/ProjectVersion.txt'
          build-targets: 'iOS'
          cache-installation: true

      - name: Activate Unity Personal License
        uses: buildalon/activate-unity-license@v2
        with:
          license: 'Personal'
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}
          license-version: '6.x'

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-iOS-
            Library-

      - name: Export Xcode Project from Unity
        run: |
          echo "Using Unity Editor at: $UNITY_EDITOR_PATH"
          "$UNITY_EDITOR_PATH" \
            -acceptSoftwareTermsForThisRunOnly \
            -batchmode \
            -projectPath . \
            -executeMethod StreamerGame.Editor.BuildScript.BuildIOS \
            -quit \
            -logFile unity_ios_export.log || true

          if [ -f "unity_ios_export.log" ]; then
            echo "=== UNITY BUILD LOG (LAST 100 LINES) ==="
            tail -n 100 unity_ios_export.log
          fi

      - name: Verify Xcode Project
        run: |
          if [ -d "Builds/iOS" ]; then
            echo "Found Xcode project in Builds/iOS"
            ls -la Builds/iOS
          else
            echo "Error: Builds/iOS directory not found!"
            exit 1
          fi

      - name: Build Xcode Project (Unsigned)
        run: |
          cd Builds/iOS
          SCHEME="Unity-iPhone"
          if [ ! -d "Unity-iPhone.xcodeproj" ]; then
            PROJ=$(find . -name "*.xcodeproj" -maxdepth 1 | head -n 1)
            PROJ_NAME=$(basename "$PROJ" .xcodeproj)
            SCHEME="$PROJ_NAME"
          fi

          echo "Building scheme: $SCHEME"
          xcodebuild clean build \
            -project Unity-iPhone.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            -destination 'generic/platform=iOS' \
            ONLY_ACTIVE_ARCH=NO \
            -derivedDataPath build_output

      - name: Package Unsigned IPA
        run: |
          cd Builds/iOS
          APP_PATH=$(find build_output/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "*.app" | head -n 1)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "Error: No .app bundle found!"
            exit 1
          fi

          echo "Packaging application bundle: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r game-ios-ipa.ipa Payload
          echo "IPA packaging complete:"
          ls -lh game-ios-ipa.ipa

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-ios-ipa
          path: Builds/iOS/game-ios-ipa.ipa
          if-no-files-found: error
